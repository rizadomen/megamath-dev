<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FB923C" />
  <link rel="icon" type="image/png" href="https://megamath.my.id/favicon-megamath.png" />
  <title>Portal Login Tim &amp; Pengajar — Mega Math</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      -webkit-tap-highlight-color: transparent;
      scroll-behavior: smooth;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-pop {
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen bg-[#FFFDF9] text-slate-800 flex flex-col">

  <!-- CUSTOM POP-UP MODAL -->
  <div id="mm-modal-overlay" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div id="mm-modal-box" class="modal-pop bg-white border-[1.5px] border-orange-100 shadow-2xl rounded-[2rem] max-w-sm w-full p-6 sm:p-7 text-center space-y-4">
      <div id="mm-modal-icon" class="w-16 h-16 mx-auto rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-3xl shadow-inner">
        ✨
      </div>
      <div class="space-y-1.5">
        <h3 id="mm-modal-title" class="text-lg sm:text-xl font-black text-slate-800">Pemberitahuan</h3>
        <p id="mm-modal-message" class="text-xs sm:text-sm font-semibold text-slate-600 leading-relaxed whitespace-pre-line">Pesan notifikasi.</p>
      </div>
      <div id="mm-modal-actions" class="pt-2 flex items-center justify-center gap-2.5"></div>
    </div>
  </div>

  <!-- NAVBAR -->
  <header class="sticky top-0 z-30 bg-[#FFFDF9]/90 backdrop-blur-md border-b border-orange-100">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <a href="index.html" class="flex items-center gap-2.5 min-w-0">
        <img src="https://megamath.my.id/favicon-megamath.png" alt="Mega Math" class="w-10 h-8 object-contain mix-blend-multiply shrink-0" />
        <div class="min-w-0">
          <span class="block text-sm sm:text-base font-extrabold text-slate-800 truncate">Mega Math</span>
          <span class="block text-[10px] font-bold text-orange-600 uppercase tracking-wider truncate">Portal Internal Tim</span>
        </div>
      </a>

      <a href="index.html"
        class="inline-flex items-center gap-1.5 text-xs font-extrabold px-3.5 py-2 rounded-xl border border-orange-200 bg-white hover:bg-orange-50 text-orange-700 transition shrink-0">
        <span>🎓</span><span>Halaman Siswa</span>
      </a>
    </div>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto px-4 pt-10 pb-16 flex flex-col justify-center">
    <!-- VIEW 0: LOADING CEK SESI AKTIF -->
    <section id="view-loading" class="text-center">
      <div class="bg-white border-[1.5px] border-orange-100 shadow-lg shadow-orange-500/5 rounded-[2rem] p-8 space-y-3">
        <div class="w-12 h-12 mx-auto rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-2xl animate-pulse">⏳</div>
        <p id="loading-status" class="text-xs font-extrabold text-slate-500">Memeriksa sesi login...</p>
      </div>
    </section>

    <!-- VIEW 1: SATU FORM LOGIN UNTUK ADMIN, STAFF & GURU -->
    <section id="view-login" class="hidden">
      <div class="bg-white border-[1.5px] border-orange-100 shadow-xl shadow-orange-500/5 rounded-[2rem] p-6 sm:p-8 space-y-6 text-center">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-3xl shadow-inner">
          🪪
        </div>

        <div class="space-y-1.5">
          <span class="inline-block px-3 py-1 rounded-full bg-orange-50 border border-orange-200 text-orange-700 text-[10px] font-extrabold uppercase tracking-wider">
            Admin • Staff • Guru
          </span>
          <h1 class="text-xl sm:text-2xl font-black text-slate-800">Masuk ke Mega Math</h1>
          <p class="text-xs font-semibold text-slate-500 leading-relaxed">
            Gunakan <span class="font-extrabold text-slate-700">9 digit ID User</span> Anda. Sistem otomatis mengarahkan ke dashboard sesuai jabatan.
          </p>
        </div>

        <form id="form-unified-login" class="space-y-4 text-left">
          <div>
            <label for="login-user-id" class="block text-xs font-extrabold text-slate-700 mb-1.5">ID User (9 Digit Angka)</label>
            <input id="login-user-id" type="text" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" required autocomplete="username" placeholder="Contoh: 202648291"
              class="w-full px-4 py-3.5 rounded-2xl border-[1.5px] border-orange-100 focus:border-orange-400 focus:outline-none text-base font-black tracking-widest bg-[#FFFDF9]" />
          </div>

          <div>
            <label for="login-password" class="block text-xs font-extrabold text-slate-700 mb-1.5">Password</label>
            <input id="login-password" type="password" required autocomplete="current-password" placeholder="Masukkan password..."
              class="w-full px-4 py-3.5 rounded-2xl border-[1.5px] border-orange-100 focus:border-orange-400 focus:outline-none text-sm font-bold bg-[#FFFDF9]" />
          </div>

          <button id="btn-login-submit" type="submit"
            class="w-full py-3.5 rounded-2xl bg-gradient-to-br from-orange-400 to-orange-600 hover:from-orange-500 hover:to-orange-700 active:scale-[0.99] text-white font-extrabold text-sm shadow-lg shadow-orange-500/25 transition disabled:opacity-60">
            Masuk Sesuai Jabatan →
          </button>
        </form>
      </div>
    </section>
  </main>

  <footer class="border-t border-orange-100 bg-white py-6 px-4 text-center text-xs text-slate-500 font-semibold">
    © 2026 Mega Math - Bimbel Private • Single Sign-On Portal
  </footer>

  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, doc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Peta tujuan halaman berdasarkan role di Firestore
    const ROLE_ROUTES = {
      admin: "admin.html",
      staff: "staff.html",
      guru: "guru.html"
    };

    function showCustomModal({ type = 'warning', title = '', message = '', confirmText = 'Mengerti' }) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('mm-modal-overlay');
        const box = document.getElementById('mm-modal-box');
        const iconEl = document.getElementById('mm-modal-icon');
        const titleEl = document.getElementById('mm-modal-title');
        const msgEl = document.getElementById('mm-modal-message');
        const actionsEl = document.getElementById('mm-modal-actions');

        const styles = {
          success: { icon: '✅', iconBg: 'bg-emerald-100 text-emerald-600', border: 'border-emerald-200', btnClass: 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-600/20' },
          error: { icon: '❌', iconBg: 'bg-rose-100 text-rose-600', border: 'border-rose-200', btnClass: 'bg-rose-600 hover:bg-rose-700 text-white shadow-rose-600/20' },
          warning: { icon: '⚠️', iconBg: 'bg-amber-100 text-amber-600', border: 'border-amber-200', btnClass: 'bg-gradient-to-br from-orange-400 to-orange-600 hover:from-orange-500 hover:to-orange-700 text-white shadow-orange-500/25' }
        };

        const cfg = styles[type] || styles.warning;
        box.className = `modal-pop bg-white border-[1.5px] ${cfg.border} shadow-2xl rounded-[2rem] max-w-sm w-full p-6 sm:p-7 text-center space-y-4`;
        iconEl.className = `w-16 h-16 mx-auto rounded-2xl ${cfg.iconBg} flex items-center justify-center text-3xl`;
        iconEl.textContent = cfg.icon;
        titleEl.textContent = title;
        msgEl.textContent = message;
        actionsEl.innerHTML = '';

        const btnOk = document.createElement('button');
        btnOk.type = 'button';
        btnOk.className = `flex-1 py-3 px-4 rounded-2xl ${cfg.btnClass} font-extrabold text-xs sm:text-sm shadow-lg transition`;
        btnOk.textContent = confirmText;
        btnOk.onclick = () => { overlay.classList.add('hidden'); resolve(true); };
        actionsEl.appendChild(btnOk);

        overlay.classList.remove('hidden');
        btnOk.focus();
      });
    }

    const mmAlert = (title, message, type = 'warning') => showCustomModal({ type, title, message });

    function idToAuthEmail(rawId) {
      const cleanId = String(rawId || '').trim().replace(/\D/g, '');
      return `${cleanId}@megamath.my.id`;
    }

    async function initFirebaseSafely() {
      const cfgMod = await import("./firebase-config.js");
      const rawCfg = cfgMod.firebaseConfig || cfgMod.default || window.firebaseConfig;

      let app;
      if (cfgMod.app) {
        app = cfgMod.app;
      } else if (getApps().length) {
        app = getApp();
      } else if (rawCfg) {
        app = initializeApp(rawCfg);
      } else {
        throw new Error("File firebase-config.js tidak ditemukan atau belum mengekspor konfigurasi Firebase.");
      }

      return {
        auth: cfgMod.auth || getAuth(app),
        db: cfgMod.db || getFirestore(app)
      };
    }

    // Pengaman: pastikan input ID hanya menerima angka
    const inputId = document.getElementById('login-user-id');
    inputId.addEventListener('input', () => {
      inputId.value = inputId.value.replace(/\D/g, '').slice(0, 9);
    });

    try {
      const { auth, db } = await initFirebaseSafely();

      // Cek apakah ada pesan penolakan akses dari halaman tujuan (misal ?err=unauthorized)
      const params = new URLSearchParams(window.location.search);
      if (params.get('err') === 'unauthorized') {
        await mmAlert('Akses Dibatasi', 'Jabatan Anda tidak memiliki izin membuka halaman tersebut.', 'warning');
        history.replaceState({}, '', 'login.html');
      }

      // Submit Form Login Tunggal
      document.getElementById('form-unified-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const rawId = inputId.value.trim();
        const password = document.getElementById('login-password').value;

        if (!/^\d{9}$/.test(rawId)) {
          await mmAlert('Format ID Salah', 'ID User wajib terdiri dari tepat 9 digit angka (contoh: 202648291).', 'warning');
          return;
        }

        const btn = document.getElementById('btn-login-submit');
        btn.disabled = true;
        btn.textContent = '⏳ Memverifikasi ID & Jabatan...';

        try {
          await signInWithEmailAndPassword(auth, idToAuthEmail(rawId), password);
          // Pengalihan halaman ditangani otomatis oleh onAuthStateChanged di bawah
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Masuk Sesuai Jabatan →';
          await mmAlert('Login Gagal', `ID "${rawId}" atau password tidak sesuai.\n(${err.code || err.message})`, 'error');
        }
      });

      // Routing Otomatis Berdasarkan Role di Firestore
      onAuthStateChanged(auth, async (user) => {
        const viewLoading = document.getElementById('view-loading');
        const viewLogin = document.getElementById('view-login');
        const loadingStatus = document.getElementById('loading-status');
        const btnSubmit = document.getElementById('btn-login-submit');

        if (!user) {
          viewLoading.classList.add('hidden');
          viewLogin.classList.remove('hidden');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Masuk Sesuai Jabatan →';
          return;
        }

        viewLogin.classList.add('hidden');
        viewLoading.classList.remove('hidden');
        loadingStatus.textContent = 'Mendeteksi jabatan & menyiapkan dashboard...';

        try {
          const snap = await getDoc(doc(db, 'users', user.uid));

          if (!snap.exists()) {
            await signOut(auth);
            await mmAlert(
              'Profil Belum Terdaftar',
              'Akun autentikasi ditemukan, tetapi data jabatan di Firestore (users) belum dibuat oleh Admin.',
              'error'
            );
            return;
          }

          const data = snap.data();

          if (!data.status_aktif) {
            await signOut(auth);
            await mmAlert(
              'Akun Nonaktif',
              `ID ${data.id_user || ''} saat ini sedang dinonaktifkan. Hubungi Admin Mega Math.`,
              'warning'
            );
            return;
          }

          const targetPage = ROLE_ROUTES[data.role];
          if (!targetPage) {
            await signOut(auth);
            await mmAlert(
              'Jabatan Tidak Dikenali',
              `Role "${data.role || '-'}" belum memiliki halaman dashboard tujuan.`,
              'error'
            );
            return;
          }

          loadingStatus.textContent = `Selamat datang, ${data.nama || data.id_user}! Mengalihkan...`;
          window.location.replace(targetPage);
        } catch (err) {
          await signOut(auth);
          await mmAlert('Gagal Memuat Profil', err.message, 'error');
        }
      });
    } catch (initErr) {
      document.getElementById('view-loading').classList.add('hidden');
      document.getElementById('view-login').classList.remove('hidden');
      await mmAlert('Konfigurasi Firebase Error', initErr.message, 'error');
    }
  </script>
</body>
</html>
